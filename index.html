<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bone Health · Practice</title>
<!-- bone-health-prototype 整合 v12 · 2026-11-16 · v12: own mobile now ends in 742 (was 156, same as the unknown sender's number); log wording no longer says onboarding. v11: Activity 5: Part 1 laid out like a Facebook group on a phone; Part 2 is an iPhone-style flow (new password, two-step verification, lock-screen texts with a real reply box) -->
<style>
:root{
  --scale:1;
  --bg:#F6EFE6; --surface:#FFFFFF; --ink:#2B211C; --muted:#66564D;
  --line:#DDCDBE;          /* static containers only */
  --ctl:#8C7768;           /* borders of things you can tap: ≥3:1 */
  --accent:#B04F27; --accent-dark:#933F1C; --accent-soft:#FCEBDF;
  --ok-bg:#E5F0E2; --ok-ink:#285C33; --ok-line:#A9C8A3;
  --warn-bg:#FBE5DA; --warn-ink:#8E3415; --warn-line:#E2A88C;
  --task-bg:#EFE6DB; --task-line:#CDBBAA; --doc-h:#F3E4D6;
  --ro-line:#E6D9CB; --ro-shadow:0 1px 3px rgba(70,45,30,.07);   /* read-only cards: lighter than any control */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.readclone{position:fixed;left:-10000px;top:0;pointer-events:none}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:#E4D8CA;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #1E4E9C;outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
b,strong{font-weight:800}

/* ---------- app shell: full screen on a phone, centred preview on a computer ---------- */
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:640px){body{padding:24px 0}#app{height:min(880px,calc(100vh - 48px));border-radius:28px;box-shadow:0 20px 50px rgba(60,40,30,.2)}}

/* top bar stays the same size whatever the text size, so it never overflows */
#top{flex:none;padding-top:env(safe-area-inset-top);background:var(--bg);font-size:16px}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 4px}
.tools{display:flex;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border-radius:12px;border:1px solid var(--ctl);background:var(--surface);font-size:16px;font-weight:700;white-space:nowrap}
.tbtn svg{width:22px;height:22px;flex:none}
.tbtn.back{border-color:transparent;background:transparent;padding:0 10px 0 2px}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent)}
.aa{font-weight:800;font-size:17px;letter-spacing:-.02em}
.tbspace{width:44px;height:44px}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 20px 10px;font-size:15px;font-weight:700;color:var(--muted);user-select:none;-webkit-user-select:none}
.segs{display:flex;gap:4px}
.segs i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.segs i.done{background:var(--ctl)}
.segs i.on{background:var(--accent)}

#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 20px 28px}
#foot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:6px}
#foot:empty{display:none}

/* ---------- type ---------- */
h1{font-size:2rem;line-height:1.2;text-align:center;margin-bottom:.6rem}
h2{font-size:1.6rem;line-height:1.25;margin-bottom:.6rem}
.eyebrow{font-size:1rem;font-weight:700;color:var(--accent-dark);margin-bottom:.4rem}
.lead{font-size:1.15rem;line-height:1.55;margin-bottom:1rem}
.meta{font-size:1rem;line-height:1.5;color:var(--muted)}
.center{text-align:center}
.secthead{font-size:1.15rem;font-weight:800;margin:1.3rem 0 .6rem}
h2.q{font-size:1.3rem;line-height:1.35;margin:1rem 0}

/* ---------- buttons: three kinds only ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:3.5rem;padding:.6rem 1rem;border-radius:16px;border:2px solid transparent;font-size:1.2rem;font-weight:800;line-height:1.25;text-align:center}
.btn svg{width:1.4rem;height:1.4rem;flex:none}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary:active{background:var(--accent-dark)}
.secondary{background:var(--surface);color:var(--accent-dark);border-color:var(--accent-dark)}
.secondary:active{background:var(--accent-soft)}
.btn.sm{min-height:3rem;font-size:1.05rem}
.link{display:inline-flex;align-items:center;justify-content:center;background:none;border:none;color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px;font-size:1.05rem;font-weight:700;min-height:48px;padding:0 6px}
.stack{display:flex;flex-direction:column;gap:10px;margin:1rem 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skiprow{margin-top:1.75rem;text-align:center}
.skiprow .link{color:var(--muted);font-weight:600}
.notice{background:var(--warn-bg);border:1.5px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:1rem;font-weight:700;line-height:1.4}
.notice:empty{display:none}

/* ---------- choices ---------- */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--ctl);border-radius:16px;padding:14px;min-height:3.5rem;font-size:1.1rem;line-height:1.4;font-weight:600}
.opt .badge{flex:none;width:2.25rem;height:2.25rem;border-radius:50%;border:2px solid var(--ctl);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;background:var(--surface)}
.opt .badge.radio::after{content:"";width:.95rem;height:.95rem;border-radius:50%}
.opt .otext{flex:1}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:.95rem;margin-top:3px;line-height:1.4}
.opt .tick{flex:none;width:1.6rem;height:1.6rem;color:var(--accent);visibility:hidden}
.opt .tick svg{width:100%;height:100%}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt.sel .badge{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.sel .badge.radio::after{background:#fff}
.opt.sel .tick{visibility:visible}
.opt.size .aa-prev{flex:none;width:2.4em;text-align:center;font-weight:800}
.opt.size .otext{font-weight:700}

/* whole card is the button */
.entries{display:flex;flex-direction:column;gap:12px;margin-bottom:1rem}
.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--ctl);border-radius:16px;padding:14px 16px;min-height:3.75rem}
.entry .et{display:block;font-size:1.15rem;font-weight:800;line-height:1.3}
.entry .es{display:block;font-size:.95rem;color:var(--muted);margin-top:3px}
.entry>svg{width:1.5rem;height:1.5rem;color:var(--accent-dark);flex:none}
.entry:active{background:var(--accent-soft)}
/* v6 · A2 Part 1 menu: icon + label tiles, like a phone home screen (labels always shown) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:7.5rem;padding:14px 8px;background:var(--surface);border:2px solid var(--ctl);border-radius:16px;text-align:center;font-size:1.1rem;font-weight:800;line-height:1.25}
.tile .ticon{flex:none;width:3rem;height:3rem;border-radius:50%;background:var(--doc-h);color:var(--accent-dark);display:flex;align-items:center;justify-content:center}
.tile .ticon svg{width:1.7rem;height:1.7rem}
.tile:active{background:var(--accent-soft)}

/* ---------- documents (report, appointment, source, share preview) ---------- */
.doc{background:var(--surface);border:1px solid var(--ro-line);box-shadow:var(--ro-shadow);border-radius:18px;overflow:hidden;margin-bottom:1rem}
.doc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--doc-h);padding:12px 16px;font-weight:800;font-size:1.05rem}
.tag{flex:none;font-size:.85rem;font-weight:800;color:var(--accent-dark);background:var(--surface);border:1.5px solid var(--accent-dark);border-radius:999px;padding:2px 10px}
.row{padding:12px 16px;border-top:1px solid var(--line)}
.k{font-size:.95rem;color:var(--muted);font-weight:600}
.v{font-size:1.2rem;font-weight:800;margin-top:2px;line-height:1.35}
.v.big{font-size:1.7rem}
.v.txt{font-size:1.1rem;font-weight:600;line-height:1.5}
.doc.compact .row{display:grid;grid-template-columns:minmax(5.5rem,32%) 1fr;gap:10px;align-items:baseline;padding:10px 14px}
.doc.compact .v{font-size:1.05rem;margin:0;font-weight:700;line-height:1.4}

/* real-format DXA report (Activity 1): looks like a radiology letter, read-only */
.dxa{padding:14px 16px 16px;font-size:1rem;line-height:1.5}
.dxa .clinic{border-bottom:2px solid #1F3D6B;padding-bottom:8px;margin-bottom:10px}
.dxa .clinic b{display:block;color:#1F3D6B;font-size:1.1rem}
.dxa .clinic small{display:block;font-size:.85rem;color:var(--muted);line-height:1.4}
.dxa h3{font-size:1.05rem;color:#1F3D6B;margin:0 0 8px;letter-spacing:.01em}
.dxa .pinfo{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;border:1px solid var(--ro-line);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:.95rem}
.dxa .pinfo dt{font-weight:800}
.dxa .pinfo dd{margin:0}
.dxa p{margin:0 0 8px}
.dxa .sec{font-weight:800;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:#1F3D6B;border-bottom:1px solid var(--ro-line);padding-bottom:2px;margin:12px 0 6px}
.dxa table{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:4px}
.dxa th{text-align:left;font-weight:800;background:#EEF1F6;padding:6px 5px;vertical-align:bottom;line-height:1.25}
.dxa td{padding:6px 5px;border-bottom:1px solid var(--ro-line);vertical-align:top}
.dxa th.n,.dxa td.n{text-align:right;white-space:nowrap}

.dxa .res3 th.n,.dxa .res3 td.n{width:33.3%;text-align:center}
.dxa .res3 tr.rg th{background:none;padding:8px 5px 0;font-weight:800}
.dxa .res3 tr.rg+tr td{padding-top:2px}
.dxa .note{font-size:.9rem;color:var(--muted)}
.dxa ol{margin:0 0 4px 1.3em;padding:0}
.dxa ol li{margin:2px 0}
.dxa .sig{margin-top:12px}
.dxa .sig i{font-family:Georgia,"Times New Roman",serif;color:#1F3D6B;font-size:1.15rem}
.dxa .key{margin-top:12px;border-top:1px solid var(--ro-line);padding-top:8px;font-size:.88rem;color:var(--muted);line-height:1.45}
.dxa .key p{margin:0 0 4px}

/* ---------- messages ---------- */
.fb{border-radius:16px;padding:14px 16px;font-size:1.05rem;line-height:1.5;margin-bottom:1rem;border:1.5px solid}
.fb>b{display:flex;align-items:center;gap:8px;font-size:1.15rem;margin-bottom:4px}
.fb svg{width:1.3rem;height:1.3rem;flex:none}
.fb.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.fb.ok>b{color:var(--ok-ink)}
.fb.try{background:#FFF6EC;border-color:#E8CDB0}
.fb.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.fb.warn>b{color:var(--warn-ink)}
.fb.info{background:var(--task-bg);border-color:var(--task-line)}
.res{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.res>div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--ro-line);border-radius:14px;padding:12px 14px;font-weight:700;font-size:1.05rem}
.res .y{display:inline-flex;align-items:center;gap:6px;color:var(--ok-ink);white-space:nowrap}
.res .y svg{width:1.1rem;height:1.1rem}
.res .n{color:var(--warn-ink);white-space:nowrap}
.res .m{color:var(--muted);white-space:nowrap}

/* task reminder (neutral, not green) */
.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--task-bg);border:1.5px solid var(--task-line);border-radius:14px;padding:10px 14px;font-size:1rem;line-height:1.4;margin-bottom:1rem;min-height:48px}
.task>svg{width:1.3rem;height:1.3rem;flex:none;color:var(--muted)}
.task .tt{flex:1}
.task .show{flex:none;font-weight:800;color:var(--accent-dark);text-decoration:underline}
.taskbox{background:var(--task-bg);border:1.5px solid var(--task-line);border-radius:16px;padding:14px 16px;font-size:1.1rem;line-height:1.5;margin-bottom:.5rem}
.taskbox .meta{margin-top:6px}

/* reference bar (look at the material again): beige strip, not white, so it never looks like an answer option */
.ref{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--task-bg);border:1px solid var(--task-line);border-radius:14px;padding:10px 14px;min-height:48px;font-size:1.05rem;font-weight:800;color:var(--accent-dark);margin-bottom:.25rem}
.ref span{flex:1}
.ref svg{width:1.3rem;height:1.3rem;flex:none}
.ref:active{background:var(--accent-soft)}
/* question number: a clear page-turn cue */
.qnum{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;font-size:1rem;border-radius:999px;padding:4px 12px;margin-bottom:.75rem}
/* comprehension check inside a review page, set apart from the preview above it */
.check{background:var(--task-bg);border:1px solid var(--task-line);border-radius:16px;padding:12px 14px 14px;margin-top:.5rem}
.check-h{font-size:.95rem;font-weight:800;color:var(--muted);text-transform:none}
.check h2.q{margin:.4rem 0 .9rem}
/* quiet follow-up actions on done / review pages, stacked */
.after{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:1rem}
/* neutral done page */
.donehead{width:64px;height:64px;border-radius:50%;background:var(--doc-h);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin:1.5rem auto 1rem}
.donehead svg{width:32px;height:32px}
.keys{margin:.25rem 0 0 1.2rem;display:flex;flex-direction:column;gap:6px}
.hero.sm{width:80px;height:80px;margin:4px auto 10px}
.hero.sm svg{width:46px;height:46px}
/* gentle fade when a new screen appears, so a page turn is noticeable */
#content.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#content.enter{animation:none}}

/* content blocks */
.hero{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FBE3CF,#F1C6A6);display:flex;align-items:center;justify-content:center;margin:12px auto 18px}
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin:0 0 1rem}
.steps li{display:flex;gap:12px;align-items:center;font-size:1.1rem;line-height:1.4;font-weight:600}
.num{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--doc-h);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:800}
.article{background:var(--surface);border:1px solid var(--ro-line);box-shadow:var(--ro-shadow);border-radius:18px;padding:18px;margin-bottom:1rem}
.article h3{font-size:1.35rem;line-height:1.3;margin-bottom:.5rem}
.article p{font-size:1.15rem;line-height:1.6;margin-bottom:.75rem}
.article .src{margin-top:.25rem}
.scenario{background:var(--surface);border:1px solid var(--ro-line);border-left:6px solid var(--accent);border-radius:16px;padding:14px 16px;font-size:1.1rem;line-height:1.55;margin-bottom:.5rem}
/* v7 · article lists and header row (falls articles in A2 and A4) */
.article ul{margin:0 0 .75rem 1.25rem;padding:0}
.article li{font-size:1.1rem;line-height:1.55;margin:.35rem 0}
.arthead{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* v8 · A3 sponsored post, laid out like a feed ad: page row with a ⋯ menu, story text, photo, link bar, reactions */
.post{background:var(--surface);border:1px solid var(--ro-line);box-shadow:var(--ro-shadow);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.post-h{display:flex;align-items:center;gap:8px;padding:8px 6px 6px 14px}
.post-name{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0;background:none;border:none;border-radius:10px;text-align:left}
.post-av{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:#2F5D50;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem}
.post-n{flex:1;min-width:0;line-height:1.3}
.post-n b{display:block;font-size:1.05rem}
.post-n span{font-size:.9rem;color:var(--muted)}
.post-more{flex:none;width:48px;height:48px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.post-more svg{width:1.6rem;height:1.6rem}
.post-more:active,.post-name:active{background:#F0F2F5}
.post-t{padding:0 14px 10px;font-size:1.05rem;line-height:1.5}
.post-t p{margin:0 0 8px}
.post-t .fine{font-size:.85rem;color:var(--muted);line-height:1.4;margin:0}
.post-photo{display:block;width:100%;height:auto;aspect-ratio:640/427;object-fit:cover;background:#D9D5CE}
.post-link{display:flex;align-items:center;gap:10px;background:#F0F2F5;padding:10px 14px}
.post-link .pl{flex:1;min-width:0;line-height:1.3}
.post-link small{display:block;font-size:.8rem;color:var(--muted);letter-spacing:.03em}
.post-link b{display:block;font-size:1rem}
.post-link .pd{display:block;font-size:.9rem;color:var(--muted)}
.post-cta{flex:none;background:#E2E5EA;border-radius:8px;padding:9px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.post-react{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;font-size:.9rem;color:var(--muted)}
.post-react .rx{display:inline-flex;align-items:center;gap:4px}
.post-react .rx i{width:1.25rem;height:1.25rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.post-react .rx i+i{margin-left:-8px;border:1.5px solid #fff;box-sizing:content-box}
.post-react .rx i svg{width:.75rem;height:.75rem}
.post-react .rx em{font-style:normal;margin-left:4px}
.post-acts{display:flex;border-top:1px solid var(--ro-line);margin:0 14px;padding:4px 0 6px;color:var(--muted);font-weight:700;font-size:.95rem}
.post-acts span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px}
.post-acts svg{width:1.15rem;height:1.15rem}
/* v11 · A5 Part 1: a public group as it looks in the Facebook phone app (group header, post, comments in grey bubbles).
   Layout and colours follow the app; no logo or wordmark. */
.fbx{background:#fff;color:#050505;border:1px solid var(--ro-line);box-shadow:var(--ro-shadow);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.fbx-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #E4E6EB;color:#050505}
.fbx-bar svg{flex:none;width:1.4rem;height:1.4rem}
.fbx-bar .t{flex:1;min-width:0;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbx-cover{height:5.25rem;background:linear-gradient(135deg,#8FBCE0 0%,#B9DCCB 60%,#E9D9B8 100%);display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 12px}
.fbx-gh{padding:10px 14px 12px}
.fbx-gh h3{font-size:1.4rem;line-height:1.25;margin-bottom:2px}
.fbx-meta{display:flex;align-items:center;gap:6px;min-height:44px;padding:0;background:none;border:none;color:#65676B;font-size:.95rem;font-weight:600;text-align:left}
.fbx-meta svg{flex:none;width:1rem;height:1rem}
.fbx-meta:active{background:#F0F2F5}
.fbx-join{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;border:none;border-radius:8px;background:#0866FF;color:#fff;font-weight:700;font-size:1rem;margin-top:4px}
.fbx-join svg{width:1.1rem;height:1.1rem}
.fbx-sep{height:8px;background:#C9CCD1}

    art:{walk:{t:"Keeping a walkway clear",b:"<p>Many falls happen in and around the home, often over things left on the floor. A clear path through each room makes a trip less likely.</p><ul><li>Keep hallways, doorways and stairs free of shoes, bags, boxes and other clutter.</li><li>Run electrical cords along the wall or behind furniture, not across walkways.</li><li>Remove loose rugs and mats, or fix them down with non-slip backing.</li><li>Get someone to help with anything that is heavy or awkward to move.</li></ul>"},
         balance:{t:"Exercises for better balance",b:"<p>Exercises that build balance and leg strength are one of the most effective ways to lower your chance of a fall.</p><ul><li>Try simple balance activities, such as standing on one leg while holding the kitchen bench.</li><li>Tai chi and community strength-and-balance classes are good, social ways to start.</li><li>Do them regularly, and build up slowly.</li><li>Ask a physiotherapist which exercises are safe for you, especially if you have had a fall.</li></ul>"},
         shoes:{t:"Choosing safe shoes and slippers",b:"<p>Shoes that fit well and hold your foot firmly help you stay steady on your feet.</p><ul><li>Choose a low, wide heel and a thin, firm sole with good grip.</li><li>Look for a firm back, and laces, buckles or velcro that keep the shoe on.</li><li>Avoid loose slippers, thongs, and walking around in socks.</li><li>Have your feet measured now and then, as shoe size can change with age.</li></ul>"},
         afterfall:{t:"What to do after a fall",b:"<p>Knowing what to do can help you stay calm if you have a fall.</p><ul><li>Stay still for a moment and check whether you are hurt.</li><li>If you are not hurt, roll onto your side, get onto your hands and knees, and use a sturdy chair to help you get up slowly.</li><li>If you are hurt or can't get up, call for help. In an emergency, call Triple Zero (000).</li><li>Tell your doctor about any fall, even if you weren't hurt.</li></ul>"},
         reports:{t:"About sample reports",b:"<p>The reports in this app are made up for practice. A report shows where a measurement was taken, the result number and a short summary.</p>"},
         proto:{t:"Using this prototype",b:"<p>You can make text bigger with <b>Text size</b>, hear a page with <b>Listen</b>, and go back at any time.</p>"}},

const SCR={};
function def(id,act,label,view,o={}){SCR[id]=Object.assign({id,act,label,view},o);}
const HOOK={2:(scr,from)=>a2Enter(scr,from)};

function go(id,push=true){
  const from=S.screen,fa=SCR[from].act,ta=SCR[id].act;
  if(push) S.hist.push(from);
  leave();
  if(fa!==ta&&fa>=1&&fa<=5){(S.time[fa]=S.time[fa]||{}).end=ms();log("activity end","Activity "+fa);}
  S.screen=id;
  if(fa!==ta&&ta>=1&&ta<=5){S.time[ta]=S.time[ta]||{};if(S.time[ta].start==null)S.time[ta].start=ms();log("activity start","Activity "+ta);}
  log("view",SCR[id].label);
  HOOK[ta]&&HOOK[ta](id,from);
  render(true);
}
function back(){
  if(!S.hist.length||SCR[S.screen].noBack) return;
  const from=S.screen,a=SCR[from].act;
  S.backs[a]=(S.backs[a]||0)+1;log("back","from "+SCR[from].label);
  leave();S.screen=S.hist.pop();
  HOOK[a]&&HOOK[a](S.screen,from);
  render(true);
}
function goAct(n){S.hist=[];go(FIRST[n]||"end",false);}
/* v8 · tester shortcut: go straight to the start of any activity and clear that activity's answers, so it can be tried
   again without going through the whole flow. Switched on in the researcher view; off again after "Restart for a new participant". */
function testGo(n){leave();
  if(n>=1&&n<=5){S["a"+n]=fresh()["a"+n];delete S.backs[n];delete S.nudges[n];delete S.skipped[n];S.time[n]={start:ms()};}
  S.hist=[];S.screen=n===0?"welcome":(FIRST[n]||"end");
  log("tester jump",n===0?"Start":n===6?"End":"Activity "+n+" (its answers cleared)");render(true);}
function leave(){closeSheet(true);stopSpeech();stopVoice();}

function render(reset){
  const sc=SCR[S.screen],v=sc.view();
  $("top").innerHTML=topbar(sc);
  $("content").innerHTML=v.c+(v.skip?`<div class="skiprow"><button class="link" onclick="openSkip()">${v.skip}</button></div>`:"");
  $("foot").innerHTML=v.f?`<div class="notice" id="notice" role="alert"></div>${v.f}`:"";
  if(reset){
    const ct=$("content");ct.classList.remove("enter");void ct.offsetWidth;ct.classList.add("enter");
    $("content").scrollTop=0;
    const h=$("content").querySelector("h1,h2");
    if(h){h.setAttribute("tabindex","-1");try{h.focus({preventScroll:true});}catch(e){}}
  }
}
const PART={a2:()=>S.screen==="a2_done"?0:(S.a2.part==="A"?1:2),a4_card:1,a4_q1:1,a4_ask:2,a4_review:2,
  a5_forum:1,a5_q1:1,a5_q2:1,a5_pw:2,a5_tfa:2,a5_lock:2,a5_msgs:2,a5_thread:2};
function partOf(id){const p=PART[id]??(id.startsWith("a2_")?PART.a2:0);return typeof p==="function"?p():p;}
function topbar(sc){
  const canBack=S.hist.length&&!sc.noBack;
  const inAct=sc.act>=1&&sc.act<=5,pt=inAct?partOf(sc.id):0;
  return `<div class="tb">
    ${canBack?`<button class="tbtn back" onclick="back()">${I.back}<span>${C.back}</span></button>`:`<span class="tbspace"></span>`}
    <div class="tools">
      <button class="tbtn" onclick="openSize()" aria-label="${C.textSize}"><span class="aa" aria-hidden="true">Aa</span><span>${C.textSize}</span></button>
      <button class="tbtn${speaking?" on":""}" id="readBtn" onclick="readAloud()">${speaking?I.stop:I.speaker}<span>${speaking?C.stop:C.listen}</span></button>
    </div></div>
    ${S.tester?`<div class="tst noread"><span>Tester</span>${[0,1,2,3,4,5,6].map(n=>`<button class="${(n===6?sc.id==="end":n===0?sc.id==="welcome":sc.act===n)?"cur":""}" onclick="testGo(${n})">${n===0?"Start":n===6?"End":n}</button>`).join("")}</div>`:""}
    ${inAct?`<div class="prog" onclick="secretTap()"><span>${C.act(sc.act)}${pt?` · ${C.partOf(pt)}`:""}</span><span class="segs" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<sc.act?"done":i===sc.act?"on":""}"></i>`).join("")}</span></div>`:""}`;
}
function nudge(msg){const n=$("notice");if(n){n.textContent="";setTimeout(()=>{n.textContent=msg;},30);}
  const a=curAct();S.nudges[a]=(S.nudges[a]||0)+1;log("prompted to answer first",msg);}

    return `<button class="opt${sel===k?" sel":""}" role="radio" aria-checked="${sel===k}" onclick="${fn}'${k}')">${badge}<span class="otext">${h}</span><span class="tick">${I.check}</span></button>`;}).join("")}</div>`;}
/* reference bar: opens material to look at again (report / message / advice). Not a choice, not a main action. */
const refBar=(label,fn)=>`<button class="ref noread" onclick="${fn}">${I.doc}<span>${label}</span>${I.chev}</button>`;
const qNum=(n,t)=>`<div class="qnum">${C.qOf(n,t)}</div>`;
function entry(t,s,a){return `<button class="entry" onclick="${a}"><span><span class="et">${t}</span>${s?`<span class="es">${s}</span>`:""}</span>${I.chev}</button>`;}
function docCard(title,rows,tag=C.sample,cls=""){
  return `<div class="doc ${cls}"><div class="doc-h"><span>${title}</span>${tag?`<span class="tag">${tag}</span>`:""}</div>${
    rows.map(([k,v,c])=>`<div class="row"><div class="k">${k}</div><div class="v${c?" "+c:""}">${v}</div></div>`).join("")}</div>`;}
function reportCard(){const R=C.report,tbl=(cols,rows)=>`<table><thead><tr>${cols.map((c,i)=>`<th${i?' class="n"':""}>${c}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return `<div class="doc"><div class="doc-h"><span>${R.title}</span><span class="tag">${C.sample}</span></div><div class="dxa">
  <div class="clinic"><b>${R.clinic}</b><small>${R.clinicSub}</small></div>
  <h3>${R.heading}</h3>
  <dl class="pinfo">${R.info.map(([k,v])=>`<dt>${k}:</dt><dd>${v}</dd>`).join("")}</dl>
  <p>${R.dear}</p><p>${R.intro}</p>
  <div class="sec">${R.histT}</div><p>${R.hist}</p>
  <div class="sec">${R.resT}</div><table class="res3"><thead><tr>${R.cols.slice(1).map(c=>`<th class="n">${c}</th>`).join("")}</tr></thead><tbody>${
    R.res.map(r=>`<tr class="rg"><th colspan="3" scope="rowgroup">${r[0]}</th></tr><tr>${r.slice(1).map(c=>`<td class="n">${c}</td>`).join("")}</tr>`).join("")}</tbody></table>

  <div class="sec">${R.conT}</div><ol>${R.con.map(x=>`<li>${x}</li>`).join("")}</ol>

const doneBlock=(t,b)=>`<div class="donehead">${I.check}</div><h2 class="center">${t}</h2><p class="lead center">${b}</p>`;

/* ---------- bottom sheet ---------- */
function openSheet(title,body){
  $("sheet").innerHTML=`<div class="sh-head"><h3 id="shTitle">${title}</h3><button class="xbtn" aria-label="${C.close}" onclick="closeSheet()">${I.x}</button></div><div class="sh-body">${body}</div>`;
  $("sheet").classList.add("open");$("scrim").classList.add("open");
  setTimeout(()=>{const h=$("shTitle");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}},60);
}
function closeSheet(silent){if(!$("sheet").classList.contains("open"))return;$("sheet").classList.remove("open");$("scrim").classList.remove("open");if(!silent)stopSpeech();}
const sheetOpen=()=>$("sheet").classList.contains("open");

/* ---------- skip ---------- */
function openSkip(){
  const a=curAct(),s=S.screen;let two=false,body;
  if(a===2){two=true;const p=S.a2.part==="A"?C.part1:C.part2;
    body=`<button class="btn secondary" onclick="a2SkipPart()">${C.skipOnly(p)}</button><button class="btn secondary" onclick="skipActivity()">${C.skipWhole}</button>`;}
  else if(a===4&&["a4_ask","a4_review"].includes(s)){two=true;
    body=`<button class="btn secondary" onclick="a4SkipQ()">${C.skipOnly(C.part2)}</button><button class="btn secondary" onclick="skipActivity()">${C.skipWhole}</button>`;}
  else if(a===5&&s!=="a5_done"){two=true;const p=A5_P1.includes(s)?C.part1:C.part2;
    body=`<button class="btn secondary" onclick="a5SkipPart()">${C.skipOnly(p)}</button><button class="btn secondary" onclick="skipActivity()">${C.skipWhole}</button>`;}
  else body=`<button class="btn secondary" onclick="skipActivity()">${C.skipYes}</button>`;
  log("open skip",SCR[s].label);
  openSheet(two?C.skipPQ:C.skipQ,`<p class="lead">${C.skipBody}</p><button class="btn primary" onclick="closeSheet();log('keep going')">${C.keep}</button>${body}`);
}
function skipActivity(){const a=curAct();S.skipped[a]=true;log("skip activity",SCR[S.screen].label);goAct(a+1);}

/* ---------- text size (never counted as difficulty) ---------- */
function applyScale(){document.documentElement.style.setProperty("--scale",S.scale);}
function openSize(){
  openSheet(C.textSize,`${opts(C.sizes.map(([v,l])=>[String(v),`<span>${l}</span>`,""]),String(S.scale),"setSize(")}
    <p class="meta" style="margin:1rem 0">${C.sizeNote}</p><button class="btn primary" onclick="closeSheet()">${C.done}</button>`);
  /* each choice is shown at its own size, independent of the current setting */
  $("sheet").querySelectorAll(".opt").forEach((b,i)=>{const px=(17*C.sizes[i][0])+"px";b.classList.add("size");b.style.fontSize=px;
    const p=document.createElement("span");p.className="aa-prev";p.style.fontSize="1.25em";p.textContent="Aa";b.insertBefore(p,b.querySelector(".otext"));});
}
function setSize(v){v=Number(v);if(S.scale===v)return;S.scale=v;applyScale();S.assist.size++;log("text size","×"+v+" (not a difficulty signal)");openSize();}

/* ---------- read aloud (en-AU; reads the open sheet if there is one) ---------- */
let speaking=false;
function pickVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang.replace("_","-")===C.lang)||vs.find(v=>v.lang.startsWith(C.lang.slice(0,2)));}catch(e){return null;}}
function updRead(){const b=$("readBtn");if(b){b.classList.toggle("on",speaking);b.innerHTML=(speaking?I.stop:I.speaker)+`<span>${speaking?C.stop:C.listen}</span>`;}}
function stopSpeech(){if("speechSynthesis" in window)try{speechSynthesis.cancel();}catch(e){}speaking=false;updRead();}
/* read content only: buttons that are controls (reference bars, Speak, edit links, skip, "Full task") are left out.
   The clone is laid out off-screen so innerText keeps sentence breaks. Answer options and their letters are kept. */
function readableText(src){
  const box=document.createElement("div");box.className="readclone";box.setAttribute("aria-hidden","true");box.style.width=src.clientWidth+"px";
  const cl=src.cloneNode(true);cl.removeAttribute("id");
  cl.querySelectorAll(".noread,.skiprow,.btn,.xbtn,.iconbtn,svg").forEach(e=>e.remove());
  box.appendChild(cl);document.body.appendChild(box);const t=cl.innerText;box.remove();return t;}
function readAloud(){
  if(speaking){stopSpeech();log("read aloud stopped");return;}
  if(!("speechSynthesis" in window)){S.tech.push("read aloud unavailable");log("⚙ technical issue","read aloud unavailable");return;}
  const src=sheetOpen()?$("sheet").querySelector(".sh-body"):$("content");
  const head=sheetOpen()?$("shTitle").innerText+". ":"";
  const u=new SpeechSynthesisUtterance(head+readableText(src));u.lang=C.lang;const v=pickVoice();if(v)u.voice=v;u.rate=.85;
  u.onend=u.onerror=()=>{speaking=false;updRead();};
  S.assist.read++;log("read aloud",(sheetOpen()?"sheet: "+$("shTitle").innerText:SCR[S.screen].label)+" (not a difficulty signal)");
  speaking=true;updRead();speechSynthesis.speak(u);
}

/* ---------- voice input → transcript the person checks ---------- */
let VOICE=null;
function voiceUnavailable(why){S.tech.push("voice: "+why);log("⚙ technical issue","voice input: "+why);
  openSheet(C.voiceNo.t,`<p class="lead">${C.voiceNo.b}</p><button class="btn primary" onclick="closeSheet()">${C.voiceNo.ok}</button>`);}
function startVoice(btn,onText){
  if(VOICE){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  log("voice: tapped Speak",SCR[S.screen].label);
  if(!SR) return voiceUnavailable("not supported in this browser");
  let r;try{r=new SR();}catch(e){return voiceUnavailable("could not start");}
  r.lang=C.lang;r.interimResults=false;r.maxAlternatives=1;VOICE=r;
  btn.classList.add("rec");btn.innerHTML=I.stop+`<span>${C.stopSpeak}</span>`;
  r.onresult=e=>{const t=e.results[0][0].transcript;log("voice: transcript",`“${t}”`);onText(t);};
  r.onerror=e=>{VOICE=null;voiceUnavailable(e.error||"error");};
  r.onend=()=>{VOICE=null;btn.classList.remove("rec");btn.innerHTML=I.mic+`<span>${C.speak}</span>`;};
  try{r.start();}catch(e){VOICE=null;voiceUnavailable("could not start");}
}
function stopVoice(){if(VOICE){try{VOICE.stop();}catch(e){}VOICE=null;}}

function a1Pick(q,k){const A=S.a1,prev=A.ans[q];if(prev===k)return;if(prev&&A.first===null)A.edits++;
  A.ans[q]=k;log(prev?"change answer":"select",`${q.toUpperCase()}: ${prev?prev+" → ":""}${k}`);render(false);}
function a1Next(n){if(!S.a1.ans["q"+n])return nudge(C.pickFirst);go("a1_q"+(n+1));}
function a1Submit(){const A=S.a1,miss=[1,2,3].find(i=>!A.ans["q"+i]);if(miss)return nudge(C.allFirst(miss));
  const r={q1:A.ans.q1===KEY1.a1.q1,q2:A.ans.q2===KEY1.a1.q2,q3:A.ans.q3===KEY1.a1.q3};
  A.submits++;A.lastResult=r;A.lastAns={...A.ans};
  if(A.first===null){A.first={...A.ans};log("SUBMIT #1 (locked)",`Q1 ${A.ans.q1} · Q2 ${A.ans.q2} · Q3 ${A.ans.q3}`);
    if(A.ans.q1==="A")log("thinks result is normal","Q1 = A (report says osteopenia, which is lower than normal)");
    if(A.ans.q2==="A")log("misread change","Q2 = A (read the negative % as a big drop; report says no significant change)");}
  else log("submit #"+A.submits,`Q1 ${A.ans.q1} · Q2 ${A.ans.q2} · Q3 ${A.ans.q3}`);
  S.hist=[];go("a1_fb",false);}

const SEC={a2_reports:"Reports",a2_followup:"Follow-up",a2_info:"Health information",a2_sec_meds:"Medicines",a2_sec_msg:"Messages",a2_sec_me:"My details",a2_jul:"20 July 2030 details"};

/* fixed order for any on-topic search; the target is not first */
const RESULT_ORDER=["balance","shoes","walk","afterfall"];
function matchSearch(q){
  const REL=/fall|fell|trip|slip|stumbl|steady|balance|walk|hall|corridor|passage|path|door|clutter|tidy|mess|clear|obstacle|floor|stair|step|rug|\bmats?\b|cable|wire|cord|shoe|slipper|footwear|\bbags?\b|\bbox(es)?\b|hazard|safe|danger|injur|hurt|accident|exercis|prevent|home|house/i;
  if(REL.test(q))return RESULT_ORDER.slice();
  if(/report|bone|density|scan|score|result|test/i.test(q))return["reports"];
  if(/\bapp\b|prototype|using|help|text|size/i.test(q))return["proto"];
  return[];
}
function a2Enter(scr,from){
  if(scr==="a2_menu")S.hist=[];
  const A=S.a2;
  if(A.part!=="A"){a2EnterB(scr,from);return;}
  const n=A.nav;
  if(from==="a2_menu"&&SEC[scr]&&!n.first){n.first=scr;log("first section tapped",SEC[scr]);}
  if(A2WRONG.includes(scr)&&!n.wrong.includes(scr))n.wrong.push(scr);
  if(scr==="a2_jul")n.openedOther=true;
  /* v6: no "Back to activity menu" button, so record every screen between opening the target and reaching the menu */
  if(n.openedTarget&&!n.returned)n.pathAfter.push(scr);
  if(scr==="a2_jun"&&!n.openedTarget){n.openedTarget=true;n.pathAfter=[];log("✓ opened & viewed target","12 June 2030 details");}
  if(scr==="a2_menu"&&from!=="a2_menu"&&SCR[from]&&SCR[from].act===2){
    if(n.openedTarget){n.returned=true;n.returnVia=`via Back · ${n.pathAfter.length} step${n.pathAfter.length===1?"":"s"} after the target`;A.part="B";
      log("✓ Part A complete","returned to activity menu "+n.returnVia);}
    else{n.emptyReturns++;log("returned to menu","target not yet opened");}
  }
}

  /* v10/v11: Activity 5 was rebuilt, so an Activity 5 saved by an earlier version is cleared */
  try{if(!S.a5||!S.a5.p2||!("tfaOn" in S.a5.p2)){S.a5=fresh().a5;if(String(S.screen).startsWith("a5_"))S.screen="a5_forum";}if(S.tester==null)S.tester=false;}catch(e){}

    if(e.key==="R"&&e.shiftKey&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))RV_OPEN?closeRV():openRV();});
  try{if(new URLSearchParams(location.search).has("researcher")||location.hash==="#researcher"){const b=document.createElement("button");b.id="rvfab";b.textContent="Researcher";b.onclick=openRV;document.body.appendChild(b);}}catch(e){}
  if("speechSynthesis" in window)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}
  if(!saved)log("session start");
})();
</script>
